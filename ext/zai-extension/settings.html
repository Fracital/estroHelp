<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>goldenticket z.ai bridge — settings</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
  h1 { font-size: 1.25rem; }
  label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
  input { width: 100%; padding: 0.5rem; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; box-sizing: border-box; }
  button { margin-top: 1.25rem; padding: 0.5rem 1.25rem; border: 0; border-radius: 6px; background: #1a7f37; color: #fff; font: inherit; cursor: pointer; }
  #saved { margin-left: 0.75rem; color: #1a7f37; font-weight: 600; }
  .hint { color: #57606a; font-size: 0.85rem; margin-top: 0.25rem; }
</style>
</head>
<body>
  <h1>goldenticket z.ai bridge</h1>
  <p class="hint">This extension mints chat.z.ai captcha tokens in your browser. Point it at your goldenticket proxy and give it the shared token.</p>
  <label for="serverUrl">Server URL</label>
  <input id="serverUrl" type="text" placeholder="http://localhost:8799">
  <div class="hint">The base URL of the goldenticket proxy (no path).</div>
  <label for="token">Extension token</label>
  <input id="token" type="password" placeholder="shared secret">
  <div class="hint">Must match <code>ZAI_EXT_TOKEN</code> on the proxy.</div>
  <button id="save">Save</button><span id="saved"></span>
  <script src="settings.js"></script>
</body>
</html>
