# Estro behind the Cloudflare tunnel: cloudflared -> nginx:80 -> elichat:3000.
# TLS is terminated by Cloudflare, so X-Forwarded-Proto is pinned to https for
# secure cookies. SSE and the Wisp WebSocket need buffering off and long reads.
map $http_upgrade $estro_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name estro.help www.estro.help;

  client_max_body_size 32m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $estro_connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
}
